# lab-pg-relay — relais TCP entre un pgAdmin par dev et PostgreSQL (contrat I9).
#
# Un pgAdmin par dev ne doit joindre QUE sa base : il n'est donc pas sur dev-net.
# Ce relais y est, lui, et le moteur le connecte au réseau privé de chaque
# pgAdmin ouvert, sous les noms « postgres » et « postgis ». Il ne sait faire que
# ceci : deux ports, deux destinations fixes. Aucun secret, aucune terminaison
# TLS, aucun protocole interprété — PostgreSQL authentifie lui-même le rôle.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
# Bloc « stream » produit au démarrage à partir de stream.conf.template (noms des instances).
include /tmp/stream.conf;
