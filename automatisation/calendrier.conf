# automatisation/calendrier.conf — quelle tâche de nuit lancer, quel jour, sur quelles cibles.
#
# Lu par automatisation/bin/auto.sh (contrat chantiers/nuit-auto/CONTRAT.md, interface I2).
# Format : une ligne par jour, trois champs séparés par des espaces :
#     <jour> <tache> <cibles>
#   <jour>   : jour ISO de la date du lancement de 0 h (1 = lundi … 7 = dimanche). Le rattrapage
#              de 5 h 10 reprend la tâche de cette même date, il ne relit pas ce fichier pour un
#              autre jour.
#   <tache>  : nom de la tâche ; le prompt est prompts/<tache>.md (obligatoire), précédé de
#              prompts/_commun.md. prompts/<tache>-suite.md, s'il existe, est joué en phase 2
#              quand la phase principale rend "charge": "faible".
#   <cibles> : soit rotation:N (les N apps suivantes de la rotation propre à cette tâche, apps du
#              superutilisateur seulement), soit une liste fixe séparée par des virgules (noms
#              d'apps au sens de registry_app_dir ; _racine = le dépôt racine dev).
# Lignes commençant par # : commentaires.
#
# Correspondance jour → prompt :
#   lundi, mercredi, vendredi : securite   → prompts/securite.md   (failles, dépendances dangereuses)
#   mardi, jeudi              : metier-ux  → prompts/metier-ux.md  (validité métier, simplicité de l'interface)
#   samedi                    : interface  → prompts/interface.md, puis interface-suite.md si charge faible
#   dimanche                  : services   → prompts/services.md,  puis services-suite.md si charge faible
#   tests rouges après une phase          → prompts/_correction.md (une seule fois)
#   rattrapage 5 h 10 d'une session coupée → prompts/_reprise.md (avec --resume)
#
# jour ISO (1=lundi … 7=dimanche), jour de la date du lancement de 0 h
1 securite  rotation:2
2 metier-ux rotation:2
3 securite  rotation:2
4 metier-ux rotation:2
5 securite  rotation:2
6 interface lab-admin,_racine
7 services  _racine,lab-admin,storage,oauth-hub,app-builder
