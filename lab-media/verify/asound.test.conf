# Faux matériel ALSA de verify.sh (monté en /etc/asound.conf dans la capture de test SEULEMENT).
# Le haut-parleur de test « hp-test » joue dans un fichier, à travers le vrai chemin ALSA
# d'aplay (plugin « file » sur le plugin « null ») : aucune carte son n'est ouverte, aucun son
# ne sort. /dev/snd de la pile de test ne contient que de faux nœuds.
pcm.lmt_ok {
  type file
  slave.pcm "null"
  file "/speaker-out/hp-test.raw"
  format "raw"
}
