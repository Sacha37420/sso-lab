# app-priorities.conf — priorités et poids RAM (Mo) pour le déploiement
# parallèle de setup2.sh (mode tout le lab, cf. setup2.sh étape 7).
#
# Format : app:priorite:ram_mo
#   priorite : plus petit = démarre en premier
#   ram_mo   : estimation pour la PHASE DE BUILD (compilation/npm build), pas
#              la RAM d'exécution en régime stable (généralement bien moindre
#              une fois les containers up) — c'est cette phase qui est
#              coûteuse en CPU/RAM sur ce serveur (2 vCPU, 16 Go).
#
# Une app absente de ce fichier reçoit les valeurs par défaut codées dans
# setup2.sh (priorité 50, 1500 Mo).
#
# atelier-3d en priorité la plus haute (démarre en premier) MALGRÉ son poids
# le plus lourd : c'est la compilation la plus longue de tout le lab (COLMAP/
# OpenMVS depuis les sources, cf. Dockerfile) — la lancer tôt permet aux apps
# plus légères de tourner en parallèle pendant qu'elle compile, plutôt que de
# la caser en dernier une fois le budget RAM déjà consommé par les autres.
atelier-3d:5:4000

# Reste de la liste : ordre du tableau « Sous-modules existants » du CLAUDE.md
# racine, poids par défaut (Django+Angular standard, pas de compilation lourde).
analyse-lora:10:1500
app-builder:20:1500
arbre-genealogique:30:1500
carto-lab:40:1500
lab-admin:50:1500
restauration:60:1500
traitement-de-fichiers-compils:70:1500
