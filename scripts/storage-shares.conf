# storage-shares.conf — partages de `storage` liés à un groupe Keycloak.
#
# Un partage de groupe ne se crée pas par l'API (décision d'infrastructure, voir
# CLAUDE.md « Partage lié à un groupe Keycloak ») : il est provisionné par
# `manage.py create_group_share`. Ce fichier est la liste de ceux que le lab
# attend ; `scripts/storage-shares.sh` crée ceux qui manquent.
#
# Format : <nom du partage>:<groupes requis, séparés par des virgules>
# Ajouter une ligne quand une app migre vers un partage de groupe.
carto-lab:developers
code-route:developers,admins,famille,amis,dom,harem,manager,cuisinier,serveur,proprietaires
craft-lab:famille,amis,developers
restauration:manager,cuisinier,serveur
