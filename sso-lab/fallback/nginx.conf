server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Caddy parle à ce container en HTTP : sans ça, nginx forge un Location
    # absolu en http:// et le navigateur repasse par la redirection http→https
    # de Caddy. Un Location relatif conserve le schéma et l'hôte d'origine.
    absolute_redirect off;

    # Android App Links de l'application « Coffre du lab » : servi tel quel, sans redirection.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files /.well-known/assetlinks.json =404;
    }

    # Retour de connexion de l'application « Coffre du lab » (page de secours si elle ne s'ouvre pas seule).
    location ^~ /coffre-retour/ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/index.html =404;
    }

    # Un préfixe d'app tapé sans slash final (/lora) ne matche pas le
    # `handle_path /lora/*` déclaré par l'app et atterrit donc ici. On retente
    # avec le slash : la requête suivante tombera sur l'app. Un chemin déjà
    # terminé par "/" ne matche pas cette règle, donc pas de boucle. Les
    # chemins contenant un point (favicon.ico…) sont exclus : ce sont des
    # fichiers, pas des préfixes d'app.
    location ~ ^[^.]*[^/.]$ {
        return 302 $uri/$is_args$args;
    }

    location / {
        return 404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
