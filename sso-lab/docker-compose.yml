version: "3.9"

# ─────────────────────────────────────────────
# Réseau interne partagé par tous les services.
# Les services se joignent par leur nom :
#   ex. openldap:389  keycloak:8080
# ─────────────────────────────────────────────
networks:
  sso-net:
    driver: bridge
  # Réseau du répartiteur partagé (~/edge-router/) — Phase C. Rejoint
  # uniquement par caddy, en plus de sso-net qu'il garde pour atteindre
  # Keycloak/openldap/oauth2-proxy/code-server.
  edge-net:
    external: true
  # Réseau de code-server, partagé avec oauth2-proxy-code SEULEMENT (2026-10-31).
  # code-server tourne en --auth=none et monte docker.sock : sur sso-net, tout
  # conteneur du lab (dont le navigateur piloté de robot-lab) le joignait sans
  # passer par oauth2-proxy — un accès root à l'hôte. Pas `internal` : code-server
  # garde sa sortie Internet (extensions, Claude Code). Ne jamais y relier autre chose.
  code-net:
    driver: bridge
  # Réseau de l'infra (possédé par infra/docker-compose.yml) : Keycloak y joint
  # dev-postgres (base `keycloak`, chantier failles F11). Seul keycloak le rejoint.
  dev-net:
    external: true
    name: dev-net

# ─────────────────────────────────────────────
# Volumes nommés : les données survivent à
#   docker compose down  (mais pas à --volumes)
# ─────────────────────────────────────────────
volumes:
  ldap-data:
  ldap-config:
  # Base H2 de Keycloak 22 : plus montée par le service, gardée pour le retour
  # arrière (chantiers/failles/keycloak/PROCEDURE.md § 6). À retirer ensuite.
  keycloak-data:
  caddy-data:
  code-server-data:

services:

  # ──────────────────────────────────────────
  # Caddy (reverse-proxy HTTPS)
  # Écoute sur 80/443, récupère les certs Let's Encrypt automatiquement.
  # Découvre les services via les labels Docker sur chaque container.
  # Prérequis : DOMAIN et ACME_EMAIL renseignés dans .env + reset_url.sh lancé.
  # ──────────────────────────────────────────
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: caddy
    restart: unless-stopped
    # Plus de ports: — exposé uniquement via edge-net (répartiteur partagé,
    # Phase C). Rollback : réajouter ce bloc ports: et relancer
    # `docker compose up -d` suffit à revenir à l'exposition directe.
    environment:
      CADDY_INGRESS_NETWORKS: "sso-lab_sso-net"
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
      ACME_EMAIL: "${ACME_EMAIL}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy-data:/data
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - sso-net
      - edge-net

  # ──────────────────────────────────────────
  # Fallback — route par défaut du lab
  # Reçoit tout ce qu'aucun préfixe d'app ne matche : le label
  # `caddy.handle: "/*"` est le matcher le moins spécifique, et l'adaptateur
  # Caddyfile trie les `handle` du plus spécifique au moins spécifique — cette
  # route est donc toujours évaluée en dernier, après celles des apps.
  # Sans elle, une URL inconnue traverse le routeur sans rencontrer de handler
  # et Caddy répond 200 avec un corps vide (page blanche).
  #
  # Le catch-all doit venir d'un label et non d'un bloc de site dans
  # caddy/Caddyfile : caddy-docker-proxy ne fusionne pas les deux sources pour
  # un même domaine, il les concatène. Caddy rejette alors le domaine en double
  # ("ambiguous site definition") et CDP supprime le bloc généré par les labels,
  # ce qui fait disparaître les routes de toutes les apps.
  # ──────────────────────────────────────────
  fallback:
    image: nginx:alpine
    container_name: fallback
    restart: unless-stopped
    volumes:
      - ./fallback/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Le répertoire est monté, pas le fichier : un bind-mount fichier est lié à
      # l'inode, donc une réécriture de 404.html (par complete_404.sh) resterait
      # invisible du container jusqu'à son redémarrage.
      - ./fallback/html:/usr/share/nginx/html:ro
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle: "/*"
      caddy.handle.reverse_proxy: "{{upstreams 80}}"

  # ──────────────────────────────────────────
  # OpenLDAP
  # Image : bitnami/openldap (maintenue activement, remplace osixia)
  # Rôle  : annuaire d'identités (users/groups)
  # ──────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    restart: always
    environment:
      LDAP_ORGANISATION: "SSO Lab"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_CONFIG_PASSWORD: "${LDAP_CONFIG_PASSWORD}"
      LDAP_ADDITIONAL_MODULES: "memberof"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - ./ldap/init.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/init.ldif
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:${PORT_LDAP}:${PORT_LDAP}"
    networks:
      - sso-net
    command: ["--copy-service", "--loglevel", "warning"]

  # ──────────────────────────────────────────
  # phpLDAPadmin
  # Interface web pour explorer / éditer l'annuaire
  # ──────────────────────────────────────────
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    restart: always
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:${PORT_PHPLDAPADMIN}:80"
    networks:
      - sso-net
    depends_on:
      - openldap

  # ──────────────────────────────────────────
  # Keycloak 26 (mode production, base PostgreSQL `keycloak` de dev-postgres)
  # Chantier failles, F11 — procédure : chantiers/failles/keycloak/PROCEDURE.md
  # ──────────────────────────────────────────
  keycloak:
    build: ./keycloak            # FROM quay.io/keycloak/keycloak:26.8.1 + kc.sh build (db=postgres, health)
    image: sso-lab-keycloak:26.8.1
    container_name: keycloak
    restart: always
    # Plus d'env_file : le conteneur ne reçoit que ses variables (il recevait
    # tout sso-lab/.env : mots de passe LDAP, SMTP, comptes LDAP…).
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://dev-postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      # Hostname v2 (Keycloak ≥ 25) : URL complète, chemin compris. Remplace
      # KC_HOSTNAME_URL / KC_HOSTNAME_ADMIN_URL / KC_HOSTNAME_STRICT(_HTTPS) / KC_PROXY.
      # Keycloak sert à la racine (/), Caddy retire /auth : pas de http-relative-path.
      KC_HOSTNAME: "${KEYCLOAK_HOSTNAME_URL}"
      # Console d'administration : seulement par la boucle locale de l'hôte
      # (tunnel SSH -L 8080:localhost:8080). Caddy ne la sert plus.
      KC_HOSTNAME_ADMIN: "${KEYCLOAK_ADMIN_URL:-http://localhost:8080}"
      # Les backends joignent http://keycloak:8080 (JWKS, client_credentials,
      # API admin) : les URL d'arrière-plan suivent la requête, l'émetteur
      # (iss) reste celui de KC_HOSTNAME.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Ne sert qu'à une base VIDE (premier démarrage d'une installation neuve) ;
      # ignoré dès qu'un realm master existe. Remplace KEYCLOAK_ADMIN(_PASSWORD).
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
    command: ["start", "--optimized"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:${PORT_KEYCLOAK}:8080"
    healthcheck:
      # Pas de curl dans l'image : /dev/tcp de bash, port de gestion 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - sso-net
      - dev-net                  # pour joindre dev-postgres
    depends_on:
      - openldap
    volumes:
      - ./keycloak-theme/ssolab:/opt/keycloak/themes/ssolab:ro
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/auth/*"
      # Console d'administration et realm master : jamais par Internet (404).
      # L'API REST /admin/realms/* reste servie : restauration et peripheriques
      # l'appellent par l'URL publique (PROCEDURE.md § 2.4, variante 1).
      caddy.handle_path.@kcconsole.path: "/admin /admin/*"
      caddy.handle_path.@kcconsole.not.path: "/admin/realms/*"
      caddy.handle_path.@kcmaster.path: "/realms/master /realms/master/*"
      caddy.handle_path.0_respond: "@kcconsole 404"
      caddy.handle_path.1_respond: "@kcmaster 404"
      caddy.handle_path.reverse_proxy: "{{upstreams 8080}}"

  # ──────────────────────────────────────────
  # oauth2-proxy — SSO Keycloak devant code-server
  # Intercepte /code/*, vérifie la session Keycloak, puis forward à code-server.
  # Le client Keycloak "code-server" doit être créé avant le premier démarrage :
  #   bash sso-lab/setup-code-server-auth.sh
  # ──────────────────────────────────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy-code
    restart: unless-stopped
    environment:
      # Provider OIDC — Keycloak
      # Découverte automatique : ${KEYCLOAK_HOSTNAME_URL}/realms/ssolab est accessible
      # depuis Docker via hairpin NAT, et l'issuer correspond au claim iss des tokens.
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${KEYCLOAK_HOSTNAME_URL}/realms/ssolab"
      OAUTH2_PROXY_CLIENT_ID: code-server
      OAUTH2_PROXY_CLIENT_SECRET: "${CODE_SERVER_CLIENT_SECRET}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REDIRECT_URL: "https://${DOMAIN}/code/oauth2/callback"
      # Cookie de session signé (HTTPS uniquement)
      OAUTH2_PROXY_COOKIE_SECRET: "${CODE_SERVER_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_proxy_code"
      # Accès : groupe `admins` SEULEMENT (2026-10-11). code-server monte tout le
      # dépôt, le socket Docker, ~/.ssh et ~/.claude : y entrer vaut un accès root à
      # l'hôte. Il était ouvert à `developers` ; les développeurs ont désormais
      # leur propre VS Code, enfermé dans leur projet (lab-mcp, /ws/<uid>/).
      # Ne jamais y remettre `developers`.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admins"
      # Forcer les scopes sans "groups" : Keycloak n'a pas ce scope mais les groupes
      # arrivent via le mapper du client (claim "groups" dans le token).
      OAUTH2_PROXY_SCOPE: "openid email profile"
      # Comptes LDAP : Keycloak envoie email_verified=false, oauth2-proxy le rejette sinon
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    # --upstream passé en CLI (l'env var OAUTH2_PROXY_UPSTREAM est ignorée en v7 pour les slices)
    command:
      - oauth2-proxy
      - --upstream=http://code-server:8091/
    networks:
      - sso-net    # Caddy et Keycloak
      - code-net   # seul chemin vers code-server
    depends_on:
      - keycloak
      - code-server
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/code/*"
      # Après authentification, oauth2-proxy redirige vers "/" (le chemin strippé).
      # On réécrit Location: / → /code/ pour que le navigateur retombe sur la bonne URL.
      caddy.handle_path.reverse_proxy: "{{upstreams 4180}}"
      caddy.handle_path.reverse_proxy.header_down: "Location ^/$ /code/"

  # ──────────────────────────────────────────
  # Code Server — VS Code dans le navigateur
  # Workspace : /home/sacha/dev (même répertoire que SSH)
  # Claude Code CLI pré-installé dans l'image
  # Non exposé directement : passe obligatoirement par oauth2-proxy
  # ──────────────────────────────────────────
  code-server:
    build: ./code-server
    container_name: code-server
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "989"   # gid du groupe docker sur l'hôte → accès /var/run/docker.sock
    environment:
      - HOME=/home/coder
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Dev}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-dev@localhost}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-Dev}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-dev@localhost}
    volumes:
      - /home/sacha/dev:/home/coder/dev:rw
      # Second cadriciel isolé (dev2/), vrai sibling de dev/ sur l'hôte — voir
      # le plan "Second cadriciel isolé (dev2/)" dans .claude/plans/.
      - /home/sacha/dev2:/home/coder/dev2:rw
      - /home/sacha/.claude:/home/coder/.claude:rw
      - /home/sacha/.ssh:/home/coder/.ssh:ro
      - code-server-data:/home/coder/.local
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
    command:
      - code-server
      - --bind-addr=0.0.0.0:8091
      # auth=none : l'authentification est entièrement gérée par oauth2-proxy en amont.
      # code-server n'est pas exposé directement (pas de labels Caddy).
      - --auth=none
      - /home/coder/dev
    networks:
      - code-net   # jamais sso-net : voir la définition du réseau

  # ──────────────────────────────────────────
  # Spring Boot App (construite à l'étape 3)
  # Commentée pour l'instant : on l'activera quand le JAR existe
  # ──────────────────────────────────────────
  # spring-app:
  #   build: ./spring-app
  #   container_name: spring-app
  #   restart: unless-stopped
  #   environment:
  #     SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: >
  #       http://keycloak:8080/realms/ssolab
  #   ports:
  #     - "8082:8080"
  #   networks:
  #     - sso-net
  #   depends_on:
  #     - keycloak
