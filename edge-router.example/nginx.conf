# Répartiteur des ports 80 et 443 de l'hôte vers le Caddy de chaque cadriciel.
# Gabarit versionné dans dev/edge-router.example/ ; la copie active vit dans ~/edge-router/
# (hors de tout dépôt) et est posée par `bash scripts/edge-router-install.sh`.
# __DOMAIN__ est remplacé par le domaine du lab à l'installation.
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

# ── HTTPS (443) — relais TCP brut basé sur le SNI, sans déchiffrement ────────
# ssl_preread lit le ClientHello TLS (SNI) sans terminer la connexion : chaque
# Caddy continue de gérer son propre ACME (HTTP-01/TLS-ALPN-01) et son propre
# certificat, exactement comme si le port 443 lui était directement exposé.
stream {
    resolver 127.0.0.11 valid=10s;

    map $ssl_preread_server_name $backend_https {
        default               caddy:443;
        __DOMAIN__            caddy:443;
        # Second cadriciel (voir README.md de ce dossier) :
        # second.example.org  caddy2:443;
    }

    server {
        listen 443;
        proxy_pass $backend_https;
        ssl_preread on;
    }
}

# ── HTTP (80) — relais applicatif basé sur l'en-tête Host ────────────────────
# Nécessaire pour les challenges ACME HTTP-01 et les redirections HTTP→HTTPS
# de chaque Caddy. Host/X-Forwarded-* préservés pour que Caddy voie la requête
# telle qu'elle est arrivée.
http {
    resolver 127.0.0.11 valid=10s;

    map $host $backend_http {
        default               caddy:80;
        __DOMAIN__            caddy:80;
        # Second cadriciel (voir README.md de ce dossier) :
        # second.example.org  caddy2:80;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://$backend_http;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
